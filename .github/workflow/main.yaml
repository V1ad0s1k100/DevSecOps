name: CI/CD Pipeline

on: 
  push:
	branches: "main"

jobs:
  deploy:
	runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull and restart container
        run: |
          cd /path/to/your/project
          git pull origin main
          docker compose down
          docker compose up -d --build
