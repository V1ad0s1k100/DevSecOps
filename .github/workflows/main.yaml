name: CI/CD Pipeline

on:
  push:
    branches: ["main", "devops"]

jobs:
  deploy:
    runs-on: ["self-hosted", "ubuntu-server"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Backup
      run: |
        DATE=$(date +%Y-%m-%d_%H-%M-%S)

        mkdir -p ~/backup/$DATE
        
        cp ./sites/* ~/website/backup/$DATE || true

    - name: Stop old container (if exists)
      run: |
        docker stop nginx-container || true
        docker rm nginx-container || true

    - name: Build dockerfile
      run: docker build -t nginx-image .

    - name: Nginx run
      run: docker run -d --name nginx-container -p 5000:5000 nginx-image
