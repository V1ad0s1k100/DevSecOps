name: CI/CD Pipeline

on:
  push:
    branches: ["main", "devops"]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Stop old container (if exists)
          run: |
            docker stop nginx || true
            docker rm nginx || true

    - name: Docker build
      run: docker build -t "nginx" .
    
    - name: Docker run
      run: docker run -d -p 5000:5000 nginx
